<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Определи тип придаточного — Новогодняя операция</title><style>
:root{--ink:#283d43;--green:#416b60;--red:#a94848;--cream:#fffaf1}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(circle at 12% 10%,#fff 0,transparent 35%),linear-gradient(125deg,#e6eee7,#f6e7df 55%,#e7eff0);min-height:100vh}.wrap{max-width:1200px;margin:10px auto;padding:8px 18px 12px;background:rgba(255,253,247,.97);border:1px solid #d7cbb8;border-radius:20px;box-shadow:0 12px 35px #385d5b20;position:relative;overflow:hidden}.wrap:before,.wrap:after{content:'❄  ✦  ❄';position:absolute;color:#a6bcb2;font-size:24px;letter-spacing:12px;opacity:.65}.wrap:before{top:16px;left:22px}.wrap:after{bottom:12px;right:10px}h1{text-align:center;margin:2px 0 3px;font-size:clamp(23px,2.5vw,31px);color:#385c54;font-weight:normal}header p{text-align:center;margin:0 0 10px;font-size:13px;color:#6b756f}.questions{display:grid;gap:2px}.q{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid #e9e1d6}.sentence{font-size:16px;line-height:1.25}.num{font-weight:bold;color:#9a5b4e;margin-right:7px}.answer{display:flex;align-items:center;gap:7px}.answer select{width:100%;padding:6px 25px 6px 8px;border:1px solid #9caeaa;background:#fff;color:#293b3c;border-radius:5px;font:14px Georgia,serif;cursor:pointer}.mark{min-width:19px;font-weight:bold}.q.correct{background:#e8f3e9;border-radius:7px}.q.incorrect{background:#fff0ec;border-radius:7px}.q.correct .mark{color:#287544}.q.incorrect .mark{color:#b13b32}.actions{display:flex;align-items:center;justify-content:center;gap:13px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:8px;padding:8px 18px;background:var(--green);color:white;font-size:16px;cursor:pointer;font-weight:bold}button.secondary{background:#e5ded3;color:#3f4b4b}button:hover{filter:brightness(.94)}.result{text-align:center;margin-top:7px;font-size:16px;min-height:20px}.hint{text-align:center;font-size:13px;color:#6f7873;margin-top:5px}footer{text-align:center;margin-top:5px;font-size:12px;color:#7d8179}@media(max-width:720px){.wrap{margin:8px;padding:22px 12px}.q{grid-template-columns:1fr;gap:6px;padding:10px 5px}.sentence{font-size:16px}.answer select{font-size:15px}header p{padding:0 8px}}
@media(min-width:800px){body{min-height:0}.wrap{min-height:0}}
</style></head><body><main class="wrap"><header><h1>❄ Определи тип придаточного ❄</h1></header><section id="questions" class="questions"></section><div class="actions"><button id="check">✓ Проверить ответы</button><button id="reset" class="secondary">↻ Начать заново</button></div><div id="result" class="result" aria-live="polite"></div><p class="hint">После проверки можно изменить ответы и проверить ещё раз.</p></main><script>
const types=['Условия','Времени','Изъяснительное','Уступки','Определительное','Сравнения','Цели'];
const questions=[
['Если бы Гарри заранее знал обо всех ловушках, он никогда не согласился бы войти в этот дом.','Условия'],
['Едва за входной дверью послышались шаги, Кевин бросился к лестнице.','Времени'],
['Мальчик никак не мог понять, почему подозрительный фургон снова остановился возле дома.','Изъяснительное'],
['Хотя Кевин очень устал после подготовки ловушек, он продолжал внимательно следить за входной дверью.','Уступки'],
['Дом постепенно превращался в настоящую крепость, где каждая комната скрывала неожиданный сюрприз.','Определительное'],
['Кевин двигался по тёмному коридору так осторожно, словно каждый шаг мог выдать его присутствие.','Сравнения'],
['Мальчик внимательно осмотрел лестницу, на которой уже висели рождественские гирлянды.','Определительное'],
['Кевин спрятал коробку с инструментами под лестницей, чтобы грабители не обнаружили его приготовления.','Цели']
];
const root=document.getElementById('questions');questions.forEach(([sentence],i)=>{const row=document.createElement('div');row.className='q';const txt=document.createElement('div');txt.className='sentence';const number=document.createElement('span');number.className='num';number.textContent=(i+1)+'.';txt.append(number,document.createTextNode(' '+sentence));const answer=document.createElement('div');answer.className='answer';const sel=document.createElement('select');sel.setAttribute('aria-label','Тип придаточного в предложении '+(i+1));const placeholder=new Option('— Выберите тип —','');sel.add(placeholder);types.forEach(t=>sel.add(new Option(t,t)));sel.addEventListener('change',()=>{row.classList.remove('correct','incorrect');mark.textContent='';document.getElementById('result').textContent='';});const mark=document.createElement('span');mark.className='mark';answer.append(sel,mark);row.append(txt,answer);root.append(row)});
document.getElementById('check').addEventListener('click',()=>{let right=0,wrong=0,empty=0;[...root.children].forEach((row,i)=>{const val=row.querySelector('select').value;const mark=row.querySelector('.mark');row.classList.remove('correct','incorrect');if(!val){empty++;mark.textContent='';return}if(val===questions[i][1]){right++;row.classList.add('correct');mark.textContent='✓'}else{wrong++;row.classList.add('incorrect');mark.textContent='✕'}});document.getElementById('result').textContent=`Правильно: ${right} · Неправильно: ${wrong} · Без ответа: ${empty} · Всего: ${questions.length}`});
document.getElementById('reset').addEventListener('click',()=>{[...root.children].forEach(row=>{row.querySelector('select').value='';row.querySelector('.mark').textContent='';row.classList.remove('correct','incorrect')});document.getElementById('result').textContent=''});
</script></body></html>
