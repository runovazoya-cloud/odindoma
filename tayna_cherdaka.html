reateElement('span');n.className='num';n.textContent=(i+1)+'.';d.append(n,document.createTextNode(q[i][0]+' '));for(let k=0;k<2;k++){let s=document.createElement('select');s.className=k?'rule':'sign';s.setAttribute('aria-label',(k?'Правило':'Знак')+' для предложения '+(i+1));let opts=k?[['','Выбери правило'],...order.map(j=>[String(j),r[j]])]:[['','?'],['—','—'],[':',':']];for(let [v,t] of opts)s.add(new Option(t,v));s.value=a[i][k];if(checked[i])s.classList.add(correct(i,k)?'good':'bad');s.onchange=()=>{a[i][k]=s.value;checked[i]=false;render()};d.append(s);if(!k)d.append(document.createTextNode(' '+q[i][1]));} $('questions').append(d)}$('prev').disabled=page===0;$('next').disabled=page===4||![page*2,page*2+1].every(i=>checked[i]&&correct(i,0)&&correct(i,1));$('check').disabled=![page*2,page*2+1].every(i=>a[i].every(Boolean));$('msg').textContent=[page*2,page*2+1].every(i=>checked[i])?([page*2,page*2+1].every(i=>correct(i,0)&&correct(i,1))?'Всё верно!':'Исправь ответы, отмеченные красным.') : '';if(score===20){$('game').hidden=true;$('win').hidden=false}}$('check').onclick=()=>{checked[page*2]=checked[page*2+1]=true;render()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};function reset(){page=0;a=q.map(()=>['','']);checked=q.map(()=>false);$('game').hidden=false;$('win').hidden=true;render()}$('reset').onclick=reset;render();</script></html>
